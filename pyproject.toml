[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repopulse"
version = "0.1.0"
description = "Zero-dependency Git forensic health, hotspot churn, and bus-factor risk engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Umut Güngör", email = "umutgungor.dev@gmail.com" }
]
keywords = ["git", "bus-factor", "hotspots", "churn", "code-forensics", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
repopulse = "repopulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repopulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
